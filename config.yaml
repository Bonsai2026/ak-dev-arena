# =====================================================================
# AK Dev Arena — configuration (TRACKED IN GIT, NEVER PUT SECRETS HERE)
# API keys: use env vars (OPENAI_API_KEY, ...) or POST /api/keys
#           (stored in config.local.yaml which is git-ignored).
# =====================================================================
app_name: "AK Dev Arena"
version: "1.2.0"

# Bind only to loopback by default (safe). For LAN/preview expose with
# ARENA_HOST=0.0.0.0 and list extra origins in ARENA_CORS_ORIGINS.
server:
  host: "127.0.0.1"
  port: 8000

# Default model per mode. Any LiteLLM model id works, e.g.
# "gpt-5.5", "claude-opus-4-8", "gemini/gemini-3-pro",
# "deepseek/deepseek-chat", "groq/llama-3.3-70b-versatile", "ollama/llama3.1"
default_models:
  chat: "gpt-4o-mini"
  code: "gpt-4o"
  agent: "claude-opus-4-8"
  build: "gpt-5.5"

providers:
  openai:    { timeout: 120 }
  anthropic: { timeout: 180 }
  gemini:    { timeout: 120 }
  deepseek:  { timeout: 180 }
  groq:      { timeout: 120 }
  ollama:    { base_url: "http://localhost:11434", timeout: 300 }
  openrouter: { timeout: 180 }

# Agent permissions (OpenCode-style): allow | ask | deny per tool.
# Dangerous actions (delete, install, servers, git writes) ask by default.
permissions:
  list_files: allow
  read_file: allow
  write_file: allow
  edit_file: allow
  delete_file: ask
  search: allow
  run: allow
  run_build: allow
  run_tests: allow
  install_dependency: ask
  start_server: ask
  stop_server: allow
  git_status: allow
  git_diff: allow
  git_checkpoint: ask
  git_revert: ask
  web_search: allow
  web_fetch: allow
  todo: allow
  mcp: ask

# Agent hooks (Claude-Code-style shell commands; env: ARENA_TOOL, ARENA_ARGS).
hooks:
  pre_tool: ""
  post_tool: ""

# MCP servers (Anthropic Model Context Protocol). Example:
# mcp_servers:
#   - id: memory
#     command: npx
#     args: ["-y", "@modelcontextprotocol/server-memory"]
mcp_servers: []
