# =====================================================================
# AK Dev Arena — configuration (TRACKED IN GIT, NEVER PUT SECRETS HERE)
# API keys: use env vars (OPENAI_API_KEY, ...) or POST /api/keys
#           (stored in config.local.yaml which is git-ignored).
# =====================================================================
app_name: "AK Dev Arena"
version: "0.1.0"

server:
  host: "127.0.0.1"
  port: 8000

# Default model per mode. Any LiteLLM model id works, e.g.
# "gpt-5.5", "claude-opus-4-8", "gemini/gemini-3-pro",
# "deepseek/deepseek-chat", "groq/llama-3.3-70b-versatile", "ollama/llama3.1"
default_models:
  chat: "gpt-4o-mini"
  code: "gpt-4o"
  agent: "claude-opus-4-8"
  build: "gpt-5.5"

providers:
  openai:    { timeout: 120 }
  anthropic: { timeout: 180 }
  gemini:    { timeout: 120 }
  deepseek:  { timeout: 180 }
  groq:      { timeout: 120 }
  ollama:    { base_url: "http://localhost:11434", timeout: 300 }
  openrouter: { timeout: 180 }
