name: Installer

# Builds the real Windows installer (NSIS .exe) for the Tauri desktop app.
# Triggered by a version tag (v*) or manually — kept OUT of PR CI because a
# full Rust+bundle build takes ~15 min.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    name: Windows installer (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      # frontendDist in tauri.conf.json points at ../frontend/dist
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Build Tauri app (NSIS bundle only)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          args: --bundles nsis
          # v* tag → GitHub Release with the installer attached;
          # manual dispatch → build-only (no release).
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseDraft: true

      # tauri-action only uploads to a release when tagName is set — so we
      # upload the installer as a plain run artifact ourselves.
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ak-dev-studio-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
